{% extends 'base.html' %}
{% block content %}
<h2>Пакетна обробка CSV</h2>
<p>Завантажте CSV-файл з колонками <code>oblast</code>, <code>district</code>, <code>settlement</code>.</p>
<form method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".csv" required><br><br>
    <label><input type="checkbox" name="normalise"> Нормалізувати адреси</label><br><br>
    <button type="submit">Завантажити</button>
</form>
{% endblock %}
