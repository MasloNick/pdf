{% extends 'base.html' %}
{% block title %}Реєстрація — CourtNinja{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem;">&#x2694;</div>
            <h2 style="background: linear-gradient(135deg, var(--accent), #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Реєстрація</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Створіть акаунт CourtNinja</p>
        </div>
        <form method="post" action="/register">
            <div class="form-group">
                <label>Ім'я</label>
                <input type="text" name="username" placeholder="Ваше ім'я" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Мінімум 6 символів" required minlength="6">
            </div>
            <div class="form-group">
                <label>Роль</label>
                <select name="role">
                    <option value="advocate">Адвокат</option>
                    <option value="assistant">Помічник</option>
                    <option value="client">Клієнт</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Зареєструватися</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
            Вже є акаунт? <a href="/login" style="color: var(--accent); text-decoration: none;">Увійти</a>
        </div>
    </div>
</div>
{% endblock %}
