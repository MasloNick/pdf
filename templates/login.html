{% extends 'base.html' %}
{% block title %}Вхід — CourtNinja{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem;">&#x2694;</div>
            <h2 style="background: linear-gradient(135deg, var(--accent), #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">CourtNinja</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Вхід до системи</p>
        </div>
        <form method="post" action="/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введіть пароль" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">Увійти</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
            Немає акаунту? <a href="/register" style="color: var(--accent); text-decoration: none;">Зареєструватися</a>
        </div>
    </div>
</div>
{% endblock %}
