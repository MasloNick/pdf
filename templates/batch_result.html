{% extends 'base.html' %}
{% block content %}
<h2>Результати пакетної обробки</h2>
<p>Оброблено рядків: {{ rows|length }}</p>
<table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Область</th><th>Район</th><th>Населений пункт</th><th>Суд</th></tr>
    {% for row in rows %}
    <tr>
        <td>{{ row.oblast }}</td>
        <td>{{ row.district }}</td>
        <td>{{ row.settlement }}</td>
        <td>{{ row.court }}</td>
    </tr>
    {% endfor %}
</table>
<br>
<a href="/batch">&larr; Завантажити інший файл</a>
{% endblock %}
