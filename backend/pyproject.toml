[project]
name = "courtcrm-pro"
version = "2.0.0"
description = "CourtCRM Pro — NPL Portfolio Management System"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    # Redis / Celery
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "APScheduler>=3.10.0",
    # Auth
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",
    # AI / Parsing
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    # Export
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    # Encryption
    "cryptography>=43.0.0",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
