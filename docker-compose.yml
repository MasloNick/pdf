version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: courtcrm
      POSTGRES_USER: courtcrm
      POSTGRES_PASSWORD: courtcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://courtcrm:courtcrm@db:5432/courtcrm
      DATABASE_URL_SYNC: postgresql://courtcrm:courtcrm@db:5432/courtcrm
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://courtcrm:courtcrm@db:5432/courtcrm
      DATABASE_URL_SYNC: postgresql://courtcrm:courtcrm@db:5432/courtcrm
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis

volumes:
  pgdata:
